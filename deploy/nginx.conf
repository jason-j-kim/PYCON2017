# 정책 아이디어 평가 — nginx 앞단
#
#   설치:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/policy-eval
#          sudo ln -s /etc/nginx/sites-available/policy-eval /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# 아래 example.ac.kr 을 실제 도메인으로 바꾸십시오. 인증서는 certbot 이
# 이 파일을 알아서 고쳐 줍니다:
#   sudo certbot --nginx -d 평가.example.ac.kr

# ── 요청 제한 ────────────────────────────────────────────────────────
# 문답 한 번은 12번을 주고받으므로 사람이 쓰는 속도는 분당 몇 건을 넘지 않는다.
# 이보다 빠른 것은 사람이 아니다. burst 로 순간적인 몰림은 통과시킨다.
limit_req_zone $binary_remote_addr zone=peval:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=pevalconn:10m;

server {
    listen 80;
    server_name 평가.example.ac.kr;
    # 평문으로 들어온 것은 전부 https 로 보낸다. 방문자가 이 화면에
    # 자기 API 키를 붙여넣으므로 평문으로 받으면 안 된다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 평가.example.ac.kr;

    # certbot 이 채워 준다
    # ssl_certificate     /etc/letsencrypt/live/평가.example.ac.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/평가.example.ac.kr/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 붙여넣는 문답과 되불러오는 파일이 있어 넉넉히 잡는다
    client_max_body_size 20m;

    # ── 기록 화면은 밖에서 아예 닿지 못하게 한다 ─────────────────────
    #
    # 앱 안에도 잠금장치가 있다(_require_local). 여기서 또 막는 것은 겹으로
    # 두려는 것이다. sessions.db 에는 여러 사람의 문답이 함께 쌓이므로
    # 실수 한 번으로 남의 대화가 나가면 되돌릴 수 없다.
    #
    # 운영자는 SSH 터널로 봅니다:
    #     ssh -L 8000:127.0.0.1:8000 사용자@서버
    #     브라우저에서 http://localhost:8000/records
    location /records      { return 404; }
    location /api/records  { return 404; }

    location / {
        limit_req  zone=peval burst=20 nodelay;
        limit_conn pevalconn 10;

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Claude 호출이 오래 걸린다. 문답 한 턴에 30초를 넘기는 일도 있다.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        # 답이 오는 대로 흘려보낸다
        proxy_buffering off;
    }
}
