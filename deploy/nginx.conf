# 정책 아이디어 평가 — nginx 앞단
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/policy-eval
#   sudo vi /etc/nginx/sites-available/policy-eval     # server_name 을 바꾼다
#   sudo ln -s /etc/nginx/sites-available/policy-eval /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d policy.example.ac.kr
#
# ── 왜 여기에 443 블록이 없나 ────────────────────────────────────────
#
# 인증서를 아직 받지 않았기 때문이다. `listen 443 ssl` 을 써 두고 인증서가
# 없으면 nginx 는 뜨지 않는다:
#
#     no "ssl_certificate" is defined for the "listen ... ssl" directive
#
# 그러면 certbot 도 돌릴 수 없다 — certbot --nginx 는 nginx 를 다시 읽어야
# 하는데 설정이 깨져 있으면 거기서 멈춘다. 닭과 달걀이 된다.
#
# 그래서 80 만 두고 시작한다. certbot --nginx 가 이 블록을 제자리에서 고쳐
# 443·인증서·평문 이동을 알아서 붙인다. 아래 location 들은 그대로 옮겨간다.
#
# 도메인 없이 사내망에서만 쓰신다면 certbot 을 건너뛰어도 nginx 는 뜬다.
# 다만 그때는 방문자가 키를 평문으로 보내게 되므로, personal 판을 밖에
# 열지는 마십시오.

# ── 요청 제한 ────────────────────────────────────────────────────────
# 문답 한 번은 12번을 주고받으므로 사람이 쓰는 속도는 분당 몇 건을 넘지
# 않는다. 이보다 빠른 것은 사람이 아니다. burst 로 순간적인 몰림은
# 통과시킨다.
limit_req_zone  $binary_remote_addr zone=peval:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=pevalconn:10m;

# 기본값은 503 인데, 그것은 "서버가 죽었다" 로 읽힌다. 실제로는 잠깐
# 너무 빨랐을 뿐이므로 429(Too Many Requests)로 답한다. 운영자가 로그를
# 볼 때도 502·504(진짜 고장)와 구분된다.
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    # IPv6 도 받으시려면 아래 줄의 주석을 푸십시오. IPv6 가 꺼진 서버에서
    # 켜 두면 nginx 가 뜨지 않습니다:
    #   socket() [::]:80 failed (97: Address family not supported by protocol)
    # listen [::]:80;

    # 실제 도메인으로 바꾸십시오. 한글 도메인이면 punycode(xn--…)로 적어야
    # 합니다 — nginx 는 한글을 그대로 받지 않습니다.
    server_name policy.example.ac.kr;

    # 붙여넣는 문답과 되불러오는 파일이 있어 넉넉히 잡는다
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ── 기록 화면은 밖에서 아예 닿지 못하게 한다 ─────────────────────
    #
    # 앱 안에도 잠금장치가 있다(_require_local). 여기서 또 막는 것은 겹으로
    # 두려는 것이다. sessions.db 에는 여러 사람의 문답이 함께 쌓이므로
    # 실수 한 번으로 남의 대화가 나가면 되돌릴 수 없다.
    #
    # 운영자는 SSH 터널로 봅니다:
    #     ssh -L 8000:127.0.0.1:8000 사용자@서버
    #     브라우저에서 http://localhost:8000/records
    location /records     { return 404; }
    location /api/records { return 404; }

    location / {
        limit_req  zone=peval burst=20 nodelay;
        limit_conn pevalconn 10;

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Claude 호출이 오래 걸린다. 문답 한 턴에 30초를 넘기는 일도 있다.
        # 기본값 60초로는 끊긴다(504).
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        # 답이 오는 대로 흘려보낸다
        proxy_buffering off;
    }
}

# ── certbot 이 붙이고 나면 ───────────────────────────────────────────
#
# 위 블록에 이런 줄들이 생기고, 평문을 https 로 보내는 블록이 하나 더
# 만들어집니다. 손으로 고치실 필요는 없습니다.
#
#     listen 443 ssl;
#     ssl_certificate     /etc/letsencrypt/live/…/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/…/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#
# 붙은 뒤에 이 한 줄을 server 블록 안에 더 넣으시면 좋습니다.
# 한 번 https 로 들어온 브라우저가 다음부터 평문을 시도하지 않습니다.
#
#     add_header Strict-Transport-Security "max-age=31536000" always;
