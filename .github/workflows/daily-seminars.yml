name: 국회 토론회 일일 수집

on:
  schedule:
    # 매일 08:00 KST = 전날 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write          # docs/seminars.json 커밋용

concurrency:
  group: daily-seminars
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install "requests>=2.18"

      - name: 세미나 수집
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python assembly/fetch_seminars.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/seminars.json; then
            echo "변경 없음 - 커밋 생략"
          else
            git add docs/seminars.json
            git commit -m "데이터 갱신: $(date -u +%Y-%m-%d)"
            git push
          fi
